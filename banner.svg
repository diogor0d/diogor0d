<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 348" role="img" aria-label="Terminal session: Diogo Rodrigues, MSc Computer Science and Engineering, Cybersecurity specialization, Universidade de Coimbra">
  <style>
    text { font-family: ui-monospace, 'Cascadia Code', 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
    .win  { fill: #161B22; }
    .bar  { fill: #0D1117; }
    .edge { stroke: #30363D; stroke-width: 1; }
    .p    { fill: #3FB950; font-weight: 600; font-size: 15px; }
    .c    { fill: #E6EDF3; font-size: 15px; }
    .o    { fill: #8B949E; font-size: 15px; }
    .v    { fill: #4493F8; font-size: 15px; }
    .dot  { fill: #3FB950; }
    .cur  { fill: #E6EDF3; }
    .ln   { animation: appear .35s ease-out both; }
    .live { animation: pulse 2.4s ease-in-out infinite; }
    .cur  { animation: blink 1.1s step-end infinite; animation-delay: 4.2s; }
    @keyframes appear { from { opacity: 0; } }
    @keyframes pulse  { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes blink  { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @media (prefers-color-scheme: light) {
      .win  { fill: #F6F8FA; }
      .bar  { fill: #FFFFFF; }
      .edge { stroke: #D0D7DE; }
      .p, .dot { fill: #1A7F37; }
      .c, .cur { fill: #1F2328; }
      .o    { fill: #59636E; }
      .v    { fill: #0969DA; }
    }
    @media (prefers-reduced-motion: reduce) {
      .ln, .live, .cur { animation: none; }
    }
  </style>

